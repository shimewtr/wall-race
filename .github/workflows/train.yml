name: Train

# 定期実行が発火しないことがあるので、各回の最後に次の回を起動して連鎖させる（schedule は保険）。
# 止めるときはリポジトリ変数 TRAIN_CHAIN を off にする
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 学習する分数（各ランナー）
        default: '45'

# 同時に走らせない（Mac とは training/ の差分マージで同期する）
concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    # 4 台で並列に学習し、それぞれの進捗を training/ に足し込む
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Train
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          RUNNER: ${{ matrix.runner }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 終わる時刻を 2 分ずつずらして push の競合を減らす
          npm run train -- --minutes "$(( MINUTES - (RUNNER - 1) * 2 ))" --source "actions-$RUNNER"
      - run: npm run status

  chain:
    needs: train
    if: success() && vars.TRAIN_CHAIN != 'off'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run Train --repo "$GITHUB_REPOSITORY" --ref main
