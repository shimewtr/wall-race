name: Train

# 定期実行が発火しないことがあるので、各回の最後に次の回を起動して連鎖させる（schedule は保険）。
# 止めるときはリポジトリ変数 TRAIN_CHAIN を off にする
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 学習する分数
        default: '45'

# 同時に走らせない（Mac とは training/ の差分マージで同期する）
concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Train
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run train -- --minutes "$MINUTES"
      - run: npm run status
      - name: Queue next run
        if: success() && vars.TRAIN_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run Train --repo "$GITHUB_REPOSITORY" --ref main
