name: Promote Candidate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: リポジトリ内の候補JSON
        default: experiments/candidates/gen-0013-long-continue.json

concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate and promote
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: npx tsx scripts/promote-candidate.ts --candidate "$CANDIDATE" --source actions-promote
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- training
          generation=$(jq -r .generation training/champion.json)
          score=$(jq -r '.gate.score * 100' training/champion.json)
          git commit -m "train: 第 ${generation} 世代に昇格（actions-promote, 勝率 ${score}%）" -- training
          git push origin HEAD:main
      - run: npm run status
      - name: Resume training
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh variable set TRAIN_CHAIN --repo "$GITHUB_REPOSITORY" --body on
          gh workflow run Train --repo "$GITHUB_REPOSITORY" --ref main
